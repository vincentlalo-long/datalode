<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      fetch('/api/log?error=' + encodeURIComponent(msg + ' at ' + (url || 'script') + ':' + line + (error && error.stack ? ' -> ' + error.stack : '')));
    };
  </script>
  <script src="/assets/pixi.min.js"></script>
  <script src="/assets/pixi-spine.umd.js"></script>
</head>
<body>
  <div id="status" style="color:white; font-family:sans-serif; padding:10px;">Loading...</div>
  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const charId = urlParams.get("char");
      if (!charId) {
        document.getElementById("status").innerText = "Missing char parameter";
        return;
      }

      try {
        const infoRes = await fetch(`/api/info?char=${encodeURIComponent(charId)}`);
        const info = await infoRes.json();
        if (info.error) throw new Error(info.error);

        const width = 1600;
        const height = 2200;

        const app = new PIXI.Application({
          width: width,
          height: height,
          transparent: true,
          backgroundAlpha: 0,
          antialias: true,
          resolution: 1,
        });
        document.body.appendChild(app.view);
        const statusEl = document.getElementById("status");
        if (statusEl) statusEl.remove();

        const atlasRes = await fetch(`/outputs/${charId}/${info.atlas}`);
        const atlasText = await atlasRes.text();

        const TextureAtlasClass = window.pixi_spine.TextureAtlas;
        const spineAtlas = await new Promise((resolve, reject) => {
          new TextureAtlasClass(atlasText, (pageName, loaderCb) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
              const baseTex = new PIXI.BaseTexture(img);
              loaderCb(baseTex);
            };
            img.onerror = () => {
              fetch('/api/log?error=' + encodeURIComponent("Failed to load image " + pageName));
              loaderCb(null);
            };
            img.src = `/outputs/${charId}/${pageName}`;
          }, (createdAtlas) => {
            if (createdAtlas) resolve(createdAtlas);
            else reject(new Error("Failed to create TextureAtlas"));
          });
        });

        const jsonRes = await fetch(`/outputs/${charId}/${info.json}`);
        const jsonData = await jsonRes.json();

        const parser = new window.pixi_spine.SpineParser().createJsonParser();
        const spineData = parser.readSkeletonData(spineAtlas, jsonData);
        if (!spineData) throw new Error("Failed to parse Spine skeleton data");

        const spine = new window.pixi_spine.Spine(spineData);

        // Apply setup pose
        spine.skeleton.setToSetupPose();

        // Check for preferred idle animation
        const animNames = spineData.animations ? spineData.animations.map(a => a.name) : [];
        const preferred = ['IDLE', 'idle', 'Wait', 'wait', 'default', 'NOANI'];
        let chosenAnim = null;
        for (const p of preferred) {
          if (animNames.includes(p)) {
            chosenAnim = p;
            break;
          }
        }
        if (chosenAnim) {
          try {
            spine.state.setAnimation(0, chosenAnim, false);
            spine.state.apply(spine.skeleton);
          } catch (e) {
            console.warn("Could not set animation:", e);
          }
        }
        spine.skeleton.updateWorldTransform();

        // Compute local bounds for dynamic centering & scaling
        const bounds = spine.getLocalBounds();
        const bw = bounds.width || 800;
        const bh = bounds.height || 1200;

        const padX = 80;
        const padY = 80;
        const scale = Math.min((width - padX * 2) / bw, (height - padY * 2) / bh);
        spine.scale.set(scale);

        // Center on canvas
        spine.position.set(
          width / 2 - (bounds.x + bw / 2) * scale,
          height / 2 - (bounds.y + bh / 2) * scale
        );

        app.stage.addChild(spine);
        app.render();

        const readyEl = document.createElement("div");
        readyEl.id = "RENDER_READY";
        document.body.appendChild(readyEl);
        fetch('/api/log?msg=' + encodeURIComponent(`Rendered ${charId} successfully (anim: ${chosenAnim || 'setup'}, scale: ${scale.toFixed(3)})`));
      } catch (err) {
        document.body.innerHTML += `<div style="color:red; font-size:20px;">${err.message}</div>`;
        fetch('/api/log?error=' + encodeURIComponent(err.stack || err.message));
      }
    })();
  </script>
</body>
</html>
